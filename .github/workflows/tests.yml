name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Fail-closed consistency probe (receipt must be self-consistent and honest)
        run: |
          python -m szl_kernel_attest --comm python3 --duration 1 --no-burn > receipt.json
          python -c "import json; r = json.load(open('receipt.json')); assert r['fail_closed'] == (r['kernel_evidence'] is None), 'inconsistent fail-closed state'; assert r['kernel_note'], 'missing honest note'; assert len(r['receipt_sha256']) == 64; print('fail-closed consistent:', r['kernel_note'])"
